<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">

    <title>Pokemon Game</title>
</head>

<body>
    <div class="cabecalho" > POKEMON CARD GAME</div>
    <div class="containerPrincipal">
        <div class="barraJogo">
            <div class="timer">⏱️ <span class="tempo">00:00.0</span></div>
            <button class="botaoRecorde">🏆 Recordes</button>
        </div>
        <div class="containerCards">
            
        </div>
    </div>

    <!-- Janela dos recordes: quem zerou mais rápido em cada quantidade de cartas -->
    <div class="modalRecordes escondido">
        <div class="caixaRecordes">
            <h2>🏆 Recordes</h2>
            <p class="mensagemRecordes"></p>
            <ul class="listaRecordes"></ul>
            <div class="botoesRecordes">
                <button class="jogarDeNovo">Jogar de novo</button>
                <button class="fecharRecordes">Fechar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
